---
- name: Create the private application bucket
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  pre_tasks:
    - name: Require the approved site workflow
      ansible.builtin.assert:
        that:
          - deployment_creation_approved | default(false) | bool
          - deployment_settings is defined
        fail_msg: Run python tools/demo.py start to check and approve this deployment.
  tasks:
    - name: Create the private versioned encrypted application bucket
      amazon.aws.s3_bucket:
        name: "{{ settings.s3_bucket_name }}"
        region: "{{ settings.aws_region }}"
        encryption: AES256
        versioning: true
        object_ownership: BucketOwnerEnforced
        public_access:
          block_public_acls: true
          ignore_public_acls: true
          block_public_policy: true
          restrict_public_buckets: true
        tags: "{{ project_tags }}"
        state: present
