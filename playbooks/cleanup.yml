---
- name: Clean up all project AWS resources
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aws_region: us-east-1

    ec2_instance_name: ansible-project-ec2
    security_group_name: ansible-project-test
    key_pair_name: automated-aws-project-key
    s3_bucket_filter: automated-aws-provisioning-813334298384-us-east-1-

    db_identifier: automated-aws-project-db
    db_subnet_group_name: automated-aws-project-db-subnets
    db_security_group_name: automated-aws-project-db-sg
    vpc_id: "vpc-0d347abaa076d4f22"

  tasks:
    - name: Find manual snapshots belonging to the project database
      amazon.aws.rds_snapshot_info:
        region: "{{ aws_region }}"
        db_instance_identifier: "{{ db_identifier }}"
        snapshot_type: manual
      register: project_db_snapshots

    - name: Delete manual snapshots belonging to the project database
      amazon.aws.rds_instance_snapshot:
        region: "{{ aws_region }}"
        instance_id: "{{ db_identifier }}"
        snapshot_id: "{{ item.db_snapshot_identifier }}"
        state: absent
        wait: true
      loop: "{{ project_db_snapshots.snapshots | default([]) }}"
      loop_control:
        label: "{{ item.db_snapshot_identifier }}"

    - name: Delete the project RDS database without creating a final snapshot
      amazon.aws.rds_instance:
        region: "{{ aws_region }}"
        db_instance_identifier: "{{ db_identifier }}"
        state: absent
        skip_final_snapshot: true
        wait: true

    - name: Delete the project RDS DB subnet group
      amazon.aws.rds_subnet_group:
        region: "{{ aws_region }}"
        name: "{{ db_subnet_group_name }}"
        state: absent

    - name: Delete the project RDS security group
      amazon.aws.ec2_security_group:
        region: "{{ aws_region }}"
        name: "{{ db_security_group_name }}"
        vpc_id: "{{ vpc_id }}"
        state: absent

    - name: Find project EC2 instances
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        filters:
          "tag:Name": "{{ ec2_instance_name }}"
          instance-state-name:
            - pending
            - running
            - stopping
            - stopped
      register: project_instances

    - name: Terminate project EC2 instances
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        instance_ids: "{{ project_instances.instances | map(attribute='instance_id') | list }}"
        state: absent
        wait: true
      when: project_instances.instances | length > 0

    - name: Find project S3 buckets
      amazon.aws.s3_bucket_info:
        region: "{{ aws_region }}"
        name_filter: "{{ s3_bucket_filter }}"
      register: project_buckets

    - name: Delete project S3 buckets and all their object versions
      amazon.aws.s3_bucket:
        name: "{{ item.name }}"
        region: "{{ aws_region }}"
        state: absent
        force: true
      loop: "{{ project_buckets.buckets | default([]) }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Delete the project EC2 security group
      amazon.aws.ec2_security_group:
        name: "{{ security_group_name }}"
        region: "{{ aws_region }}"
        vpc_id: "{{ vpc_id }}"
        state: absent

    - name: Delete the AWS key-pair registration
      amazon.aws.ec2_key:
        name: "{{ key_pair_name }}"
        region: "{{ aws_region }}"
        state: absent

    - name: Report cleanup completion
      ansible.builtin.debug:
        msg:
          - "Cleanup tasks completed for the configured project resources."
          - "RDS deletion skips a final snapshot and requests deletion of automated backups."
          - "Manual RDS snapshots for this database identifier are deleted by this playbook."
          - "The local private key file has not been deleted."
          - "Verify the resources are gone in AWS and check Billing for remaining charges."
