
---
- name: Clean up the project AWS resources
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aws_region: us-east-1
    ec2_instance_name: ansible-project-ec2
    security_group_name: ansible-project-test
    key_pair_name: automated-aws-project-key
    s3_bucket_filter: automated-aws-provisioning-813334298384-us-east-1-

  tasks:
    - name: Find project EC2 instances
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        filters:
          "tag:Name": "{{ ec2_instance_name }}"
          instance-state-name:
            - pending
            - running
            - stopping
            - stopped
      register: project_instances

    - name: Terminate project EC2 instances
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        instance_ids: >-
          {{ project_instances.instances | map(attribute='instance_id') | list }}
        state: absent
        wait: true
      when: project_instances.instances | length > 0

    - name: Find project S3 buckets
      amazon.aws.s3_bucket_info:
        region: "{{ aws_region }}"
        name_filter: "{{ s3_bucket_filter }}"
      register: project_buckets

    - name: Delete project S3 buckets and all their object versions
      amazon.aws.s3_bucket:
        name: "{{ item.name }}"
        region: "{{ aws_region }}"
        state: absent
        force: true
      loop: "{{ project_buckets.buckets }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Delete the project security group
      amazon.aws.ec2_security_group:
        name: "{{ security_group_name }}"
        region: "{{ aws_region }}"
        state: absent

    - name: Delete the AWS key-pair registration
      amazon.aws.ec2_key:
        name: "{{ key_pair_name }}"
        region: "{{ aws_region }}"
        state: absent

    - name: Report cleanup completion
      ansible.builtin.debug:
        msg:
          - "Cleanup tasks completed."
          - "The local private key file has not been deleted."
          - "Check AWS for any remaining resources or charges."
