
---
- name: Create the project EC2 key pair
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aws_region: us-east-1
    key_pair_name: automated-aws-project-key
    private_key_path: "{{ lookup('env', 'HOME') }}/.ssh/automated-aws-project-key.pem"

  tasks:
    - name: Create the local SSH directory
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.ssh"
        state: directory
        mode: "0700"

    - name: Create the AWS key pair if it does not exist
      amazon.aws.ec2_key:
        name: "{{ key_pair_name }}"
        region: "{{ aws_region }}"
        key_type: rsa
        state: present
      register: key_pair_result

    - name: Save the newly generated private key locally
      ansible.builtin.copy:
        content: "{{ key_pair_result.private_key }}"
        dest: "{{ private_key_path }}"
        mode: "0400"
        force: true
      when: key_pair_result.private_key is defined

    - name: Check that the private key file exists
      ansible.builtin.stat:
        path: "{{ private_key_path }}"
      register: private_key_file

    - name: Stop if the private key is unavailable locally
      ansible.builtin.assert:
        that:
          - private_key_file.stat.exists
        fail_msg: >-
          The AWS key pair exists, but its private key is not available
          at the expected local path. AWS cannot retrieve an existing
          private key. If no instance depends on this key, delete the
          AWS key pair and rerun this playbook.

    - name: Display key pair details
      ansible.builtin.debug:
        msg:
          - "Key pair: {{ key_pair_name }}"
          - "Private key path: {{ private_key_path }}"
          - "Keep the private key outside GitHub and never share it."
