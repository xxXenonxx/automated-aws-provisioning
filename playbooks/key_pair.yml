---
- name: Prepare the application SSH key
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Read the selected settings
      ansible.builtin.include_vars:
        file: "{{ project_config_file | default(playbook_dir ~ '/../config/environment.json') }}"
        name: key_settings

    - name: Validate the settings before preparing a key
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../tools/project_checks.py"
          - validate
          - --config
          - "{{ project_config_file | default(playbook_dir ~ '/../config/environment.json') }}"
      changed_when: false

    - name: Check the local private key
      ansible.builtin.stat:
        path: "{{ key_settings.ssh_private_key_file | expanduser }}"
      register: local_key

    - name: Check whether the AWS key already exists
      amazon.aws.ec2_key_info:
        region: "{{ key_settings.aws_region }}"
        filters:
          key-name: "{{ key_settings.ec2_key_name }}"
      register: aws_key

    - name: Stop if only one half of the key pair exists
      ansible.builtin.assert:
        that:
          - (aws_key.keypairs | length > 0) == (local_key.stat.exists | bool)
        fail_msg: The AWS key and its local private file must both exist, or both be new. Recover the original private file or choose a new key name and path.

    - name: Create the local SSH directory
      ansible.builtin.file:
        path: "{{ key_settings.ssh_private_key_file | expanduser | dirname }}"
        state: directory
        mode: '0700'

    - name: Create and save a new key through Ansible
      amazon.aws.ec2_key:
        name: "{{ key_settings.ec2_key_name }}"
        region: "{{ key_settings.aws_region }}"
        key_type: rsa
        file_name: "{{ key_settings.ssh_private_key_file | expanduser }}"
        state: present
      when: not local_key.stat.exists
      no_log: true

    - name: Restrict private key access
      ansible.builtin.file:
        path: "{{ key_settings.ssh_private_key_file | expanduser }}"
        mode: '0400'
