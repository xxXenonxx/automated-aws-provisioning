---
# Integrates the team's Complete project network and application playbooks.
- name: Provision the selected project environment
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Locate the shared deployment workflow
      ansible.builtin.set_fact:
        deployment_repo_dir: "{{ playbook_dir | regex_replace('/Complete project/playbooks$', '/deployment') }}"

    - name: Read the selected nonsecret environment settings
      ansible.builtin.include_vars:
        file: "{{ project_config_file | default(deployment_repo_dir ~ '/config/environment.json') }}"
        name: settings

    - name: Keep the selected settings bound to the checked deployment
      ansible.builtin.assert:
        that:
          - settings.profile | default('complete_application') == 'complete_application'
          - deployment_settings is not defined or settings == deployment_settings
        fail_msg: Run the complete application profile with unchanged settings throughout this deployment.

    - name: Define controller-side state and common resource tags
      ansible.builtin.set_fact:
        deployment_settings: "{{ settings }}"
        project_state_dir: "{{ deployment_repo_dir }}/state"
        project_resource_prefix: "{{ settings.project_name }}-{{ settings.environment_name }}"
        project_tags:
          Project: "{{ settings.project_name }}"
          Environment: "{{ settings.environment_name }}"
          ManagedBy: Ansible

    - name: Require the same checks and forecast approval before network creation
      ansible.builtin.import_tasks: ../../deployment/playbooks/tasks/require_approved_creation.yml

    - name: Require successful preflight for this integrated run
      ansible.builtin.assert:
        that:
          - project_identity.account is defined
          - project_azs.availability_zones | default([]) | length >= 2
        fail_msg: Run validated-site.yml to check, price and approve this complete deployment first.

    - name: Create the project VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ project_resource_prefix }}-vpc"
        region: "{{ settings.aws_region }}"
        cidr_block: "{{ settings.vpc_cidr }}"
        dns_support: true
        dns_hostnames: true
        tags: "{{ project_tags }}"
        state: present
      register: project_vpc

    - name: Create the internet gateway
      amazon.aws.ec2_vpc_igw:
        region: "{{ settings.aws_region }}"
        vpc_id: "{{ project_vpc.vpc.id }}"
        tags: "{{ project_tags }}"
        state: present
      register: project_igw

    - name: Create the public application subnet
      amazon.aws.ec2_vpc_subnet:
        region: "{{ settings.aws_region }}"
        vpc_id: "{{ project_vpc.vpc.id }}"
        cidr: "{{ settings.public_subnet_cidr }}"
        az: "{{ project_azs.availability_zones[0].zone_name }}"
        map_public: true
        tags: "{{ project_tags | combine({'Name': project_resource_prefix ~ '-public-a'}) }}"
        state: present
      register: project_public_subnet

    - name: Create the first private database subnet
      amazon.aws.ec2_vpc_subnet:
        region: "{{ settings.aws_region }}"
        vpc_id: "{{ project_vpc.vpc.id }}"
        cidr: "{{ settings.private_subnet_a_cidr }}"
        az: "{{ project_azs.availability_zones[0].zone_name }}"
        map_public: false
        tags: "{{ project_tags | combine({'Name': project_resource_prefix ~ '-private-a'}) }}"
        state: present
      register: project_private_a

    - name: Create the second private database subnet
      amazon.aws.ec2_vpc_subnet:
        region: "{{ settings.aws_region }}"
        vpc_id: "{{ project_vpc.vpc.id }}"
        cidr: "{{ settings.private_subnet_b_cidr }}"
        az: "{{ project_azs.availability_zones[1].zone_name }}"
        map_public: false
        tags: "{{ project_tags | combine({'Name': project_resource_prefix ~ '-private-b'}) }}"
        state: present
      register: project_private_b

    - name: Route only the public subnet to the internet gateway
      amazon.aws.ec2_vpc_route_table:
        region: "{{ settings.aws_region }}"
        vpc_id: "{{ project_vpc.vpc.id }}"
        subnets:
          - "{{ project_public_subnet.subnet.id }}"
        routes:
          - dest: 0.0.0.0/0
            gateway_id: "{{ project_igw.gateway_id }}"
        tags: "{{ project_tags | combine({'Name': project_resource_prefix ~ '-public-routes'}) }}"
      register: project_public_routes

    - name: Keep both database subnets on local-only private routing
      amazon.aws.ec2_vpc_route_table:
        region: "{{ settings.aws_region }}"
        vpc_id: "{{ project_vpc.vpc.id }}"
        subnets:
          - "{{ project_private_a.subnet.id }}"
          - "{{ project_private_b.subnet.id }}"
        routes: []
        purge_routes: true
        tags: "{{ project_tags | combine({'Name': project_resource_prefix ~ '-private-routes'}) }}"
      register: project_private_routes

    - name: Create web rules with restricted administrative access
      amazon.aws.ec2_security_group:
        name: "{{ project_resource_prefix }}-web"
        description: Web ports from the original architecture and restricted administrator SSH
        region: "{{ settings.aws_region }}"
        vpc_id: "{{ project_vpc.vpc.id }}"
        rules:
          - proto: tcp
            ports: [80, 443]
            cidr_ip: 0.0.0.0/0
          - proto: tcp
            ports: [22]
            cidr_ip: "{{ settings.ssh_source_cidr }}"
        rules_egress:
          - proto: -1
            cidr_ip: 0.0.0.0/0
        purge_rules: true
        tags: "{{ project_tags }}"
        state: present
      register: project_web_sg

    - name: Allow database access only from this application security group
      amazon.aws.ec2_security_group:
        name: "{{ project_resource_prefix }}-db"
        description: MySQL only from this environment application servers
        region: "{{ settings.aws_region }}"
        vpc_id: "{{ project_vpc.vpc.id }}"
        rules:
          - proto: tcp
            ports: [3306]
            group_id: "{{ project_web_sg.group_id }}"
        purge_rules: true
        tags: "{{ project_tags }}"
        state: present
      register: project_db_sg

    - name: Create the private database subnet group
      amazon.aws.rds_subnet_group:
        name: "{{ project_resource_prefix }}-db-subnets"
        region: "{{ settings.aws_region }}"
        description: Two private project subnets for MySQL
        subnets:
          - "{{ project_private_a.subnet.id }}"
          - "{{ project_private_b.subnet.id }}"
        tags: "{{ project_tags }}"
        state: present

    - name: Create the private encrypted MySQL database
      amazon.aws.rds_instance:
        region: "{{ settings.aws_region }}"
        db_instance_identifier: "{{ settings.rds_identifier }}"
        db_instance_class: "{{ settings.db_instance_class }}"
        db_name: "{{ settings.db_name }}"
        engine: mysql
        engine_version: "{{ deployment_rds_engine_version }}"
        allocated_storage: "{{ settings.db_allocated_storage }}"
        storage_type: gp3
        storage_encrypted: true
        master_username: "{{ settings.db_username }}"
        master_user_password: "{{ lookup('ansible.builtin.env', 'RDS_MASTER_PASSWORD') }}"
        db_subnet_group_name: "{{ project_resource_prefix }}-db-subnets"
        vpc_security_group_ids:
          - "{{ project_db_sg.group_id }}"
        publicly_accessible: false
        multi_az: "{{ settings.db_multi_az }}"
        backup_retention_period: 1
        auto_minor_version_upgrade: true
        engine_lifecycle_support: open-source-rds-extended-support-disabled
        copy_tags_to_snapshot: true
        tags: "{{ project_tags }}"
        wait: true
        state: present
      register: project_rds
      no_log: true

    - name: Create the private versioned encrypted application bucket
      amazon.aws.s3_bucket:
        name: "{{ settings.s3_bucket_name }}"
        region: "{{ settings.aws_region }}"
        encryption: AES256
        versioning: true
        object_ownership: BucketOwnerEnforced
        public_access:
          block_public_acls: true
          ignore_public_acls: true
          block_public_policy: true
          restrict_public_buckets: true
        tags: "{{ project_tags }}"
        state: present

    - name: Find only this environment tagged application servers
      amazon.aws.ec2_instance_info:
        region: "{{ settings.aws_region }}"
        filters:
          "tag:Project": "{{ settings.project_name }}"
          "tag:Environment": "{{ settings.environment_name }}"
          "tag:Role": application
          instance-state-name: [pending, running, stopping, stopped]
      register: existing_app_instances

    - name: Keep all retained application servers inside the reviewed request
      ansible.builtin.assert:
        that:
          - existing_app_instances.instances | map(attribute='tags.Name') | difference(deployment_instance_names) | length == 0
          - existing_app_instances.instances | map(attribute='tags.Name') | unique | list | length == existing_app_instances.instances | length
        fail_msg: Existing application servers do not match the reviewed names. Review duplicates or retained servers before provisioning; no server is deleted automatically.

    - name: Launch or reuse each selected application server
      amazon.aws.ec2_instance:
        name: "{{ item }}"
        region: "{{ settings.aws_region }}"
        key_name: "{{ settings.ec2_key_name }}"
        vpc_subnet_id: "{{ project_public_subnet.subnet.id }}"
        instance_type: "{{ settings.instance_type }}"
        image_id: "{{ settings.ami_id }}"
        iam_instance_profile: "{{ settings.app_instance_profile_name }}"
        network:
          assign_public_ip: true
        security_groups:
          - "{{ project_web_sg.group_id }}"
        metadata_options:
          http_endpoint: enabled
          http_tokens: required
        tags: "{{ project_tags | combine({'Role': 'application'}) }}"
        filters:
          "tag:Name": "{{ item }}"
          "tag:Project": "{{ settings.project_name }}"
          "tag:Environment": "{{ settings.environment_name }}"
          "tag:Role": application
          instance-state-name: [pending, running, stopping, stopped]
        volumes: "{{ deployment_root_volume_mapping }}"
        cpu_credit_specification: "{{ 'standard' if settings.instance_type is match('^t[0-9]') else omit }}"
        wait: true
        state: running
      loop: "{{ deployment_instance_names }}"
      loop_control:
        label: "{{ item }}"
      register: project_ec2_servers

    - name: Collect the exact selected application server results
      ansible.builtin.set_fact:
        project_ec2:
          instances: "{{ project_ec2_servers.results | map(attribute='instances') | flatten }}"

    - name: Require actual addresses before writing the deployment manifest
      ansible.builtin.assert:
        that:
          - project_ec2.instances | length == deployment_instance_names | length
          - project_ec2.instances | map(attribute='instance_id') | unique | list | length == deployment_instance_names | length
          - project_ec2.instances | selectattr('public_ip_address', 'defined') | list | length == deployment_instance_names | length
          - project_rds.endpoint.address is defined
        fail_msg: AWS did not return the addresses required for application configuration.

    - name: Create the controller-only state directory
      ansible.builtin.file:
        path: "{{ project_state_dir }}"
        state: directory
        mode: '0700'

    - name: Save actual nonsecret resource outputs
      ansible.builtin.copy:
        dest: "{{ project_state_dir }}/deployment.json"
        mode: '0600'
        content: >-
          {{ {
            'schema_version': 1,
            'project_name': settings.project_name,
            'environment_name': settings.environment_name,
            'aws_region': settings.aws_region,
            'account_id': project_identity.account,
            'created_at': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'),
            'cost_estimate_sha256': deployment_cost_estimate_sha256,
            'resources': {
              'vpc_id': project_vpc.vpc.id,
              'public_subnet_id': project_public_subnet.subnet.id,
              'private_subnet_ids': [project_private_a.subnet.id, project_private_b.subnet.id],
              'internet_gateway_id': project_igw.gateway_id,
              'public_route_table_id': project_public_routes.route_table.id,
              'private_route_table_id': project_private_routes.route_table.id,
              'ec2_instance_ids': project_ec2.instances | map(attribute='instance_id') | list,
              'web_security_group_id': project_web_sg.group_id,
              'db_security_group_id': project_db_sg.group_id,
              'rds_identifier': settings.rds_identifier,
              'rds_endpoint': project_rds.endpoint.address,
              'rds_port': project_rds.endpoint.port,
              'rds_engine_version': project_rds.engine_version,
              's3_bucket_name': settings.s3_bucket_name,
              'website_urls': project_ec2.instances | map(attribute='public_ip_address') | map('regex_replace', '^', 'http://') | map('regex_replace', '$', '/') | list,
              'website_url': 'http://' ~ project_ec2.instances[0].public_ip_address ~ '/'
            },
            'expected': {
              'profile': 'complete_application',
              'application_configured': false,
              'ec2_count': deployment_instance_names | length,
              'ec2_instance_type': settings.instance_type,
              'ec2_ami_id': settings.ami_id,
              'app_instance_profile_name': settings.app_instance_profile_name,
              'db_multi_az': settings.db_multi_az,
              'db_allowed_source_security_group_id': project_web_sg.group_id,
              'vpc_cidr': settings.vpc_cidr,
              'public_subnet_cidr': settings.public_subnet_cidr,
              'private_subnet_a_cidr': settings.private_subnet_a_cidr,
              'private_subnet_b_cidr': settings.private_subnet_b_cidr,
              'ssh_source_cidr': settings.ssh_source_cidr,
              'db_publicly_accessible': false,
              's3_public_access_block': true,
              's3_encryption': 'AES256',
              's3_versioning': 'Enabled'
            }
          } | to_nice_json }}
