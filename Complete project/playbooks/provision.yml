---
- name: Provision AWS Infrastructure
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    vpc_cidr: "10.0.0.0/16"
    public_subnet_cidr: "10.0.1.0/24"
    private_subnet_a_cidr: "10.0.3.0/24"
    private_subnet_b_cidr: "10.0.4.0/24"
    db_port: 3306
    s3_bucket_name: "chris-app-bucket-12345" # Must be globally unique

  tasks:
    - name: Create Custom VPC
      amazon.aws.ec2_vpc_net:
        name: app-vpc
        cidr_block: "{{ vpc_cidr }}"
        state: present
      register: vpc

    - name: Create Internet Gateway
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc.vpc.id }}"
        state: present
      register: igw

    - name: Create Public Subnet (AZ A)
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "{{ public_subnet_cidr }}"
        az: "{{ lookup('env', 'AWS_REGION') }}a"
        map_public: true
        tags:
          Name: public-subnet-a
        state: present
      register: public_subnet

    - name: Create Private Subnet (AZ A)
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "{{ private_subnet_a_cidr }}"
        az: "{{ lookup('env', 'AWS_REGION') }}a"
        tags:
          Name: private-subnet-a
        state: present
      register: private_subnet_a

    - name: Create Private Subnet (AZ B)
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "{{ private_subnet_b_cidr }}"
        az: "{{ lookup('env', 'AWS_REGION') }}b"
        tags:
          Name: private-subnet-b
        state: present
      register: private_subnet_b

    - name: Configure Public Route Table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc.vpc.id }}"
        subnets:
          - "{{ public_subnet.subnet.id }}"
        routes:
          - dest: 0.0.0.0/0
            gateway_id: "{{ igw.gateway_id }}"
        tags:
          Name: public-rt
      
    - name: Create EC2 Security Group
      amazon.aws.ec2_security_group:
        name: web-sg
        description: Allow web and SSH
        vpc_id: "{{ vpc.vpc.id }}"
        rules:
          - proto: tcp
            ports: [80, 443]
            cidr_ip: 0.0.0.0/0
          - proto: tcp
            ports: [22]
            cidr_ip: 105.192.177.166/32 # Update to your IP for security
      register: ec2_sg

    - name: Create RDS Security Group
      amazon.aws.ec2_security_group:
        name: db-sg
        description: Allow DB traffic from EC2
        vpc_id: "{{ vpc.vpc.id }}"
        rules:
          - proto: tcp
            ports: ["{{ db_port }}"]
            group_id: "{{ ec2_sg.group_id }}"
      register: rds_sg

    - name: Create RDS Subnet Group
      community.aws.rds_subnet_group:
        name: db-subnet-group
        description: Multi-AZ private subnets for RDS
        subnets:
          - "{{ private_subnet_a.subnet.id }}"
          - "{{ private_subnet_b.subnet.id }}"
        state: present

    - name: Provision MySQL RDS Instance
      amazon.aws.rds_instance:
        db_instance_identifier: app-database
        engine: mysql
        instance_type: db.t3.micro
        allocated_storage: 20
        master_username: admin
        master_user_password: SecurePassword123!
        vpc_security_group_ids: 
          - "{{ rds_sg.group_id }}"
        db_subnet_group_name: db-subnet-group
        publicly_accessible: false
        multi_az: true
        state: present

    - name: Launch EC2 Web Server
      amazon.aws.ec2_instance:
        name: web-server-1
        key_name: Ec2 key pair # Must exist in AWS
        vpc_subnet_id: "{{ public_subnet.subnet.id }}"
        instance_type: t3.micro
        security_group: "{{ ec2_sg.group_id }}"
        image_id: ami-097855b862d5b1eb2 
        state: started

    - name: Create Private S3 Bucket
      amazon.aws.s3_bucket:
        name: "{{ s3_bucket_name }}"
        state: present