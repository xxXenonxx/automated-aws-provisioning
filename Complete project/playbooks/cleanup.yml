---
- name: Teardown AWS Infrastructure
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aws_region: "us-east-1"
    s3_bucket_name: "chris-app-bucket-12345"
    instance_name: "web-server-1"

  tasks:
    - name: Fetch VPC Info
      amazon.aws.ec2_vpc_net_info:
        region: "{{ aws_region }}"
        filters:
          "tag:Name": "app-vpc"
      register: vpc_info

    - name: Ensure VPC Exists Before Cleanup
      ansible.builtin.assert:
        that: vpc_info.vpcs | length > 0
        msg: "VPC 'app-vpc' not found. Cannot proceed with cleanup."

    - name: Gather EC2 Instance ID safely
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        filters:
          "tag:Name": "{{ instance_name }}"
      register: ec2_info

    - name: Terminate EC2 Web Server
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        instance_ids: "{{ ec2_info.instances | map(attribute='instance_id') | list }}"
        state: absent
        wait: true
      when: ec2_info.instances | length > 0

    - name: Delete RDS Database
      amazon.aws.rds_instance:
        region: "{{ aws_region }}"
        db_instance_identifier: "app-database"
        state: absent
        skip_final_snapshot: true
        wait: true

    - name: Delete RDS Subnet Group
      community.aws.rds_subnet_group:
        region: "{{ aws_region }}"
        name: "db-subnet-group"
        state: absent

    - name: Delete RDS Security Group
      amazon.aws.ec2_security_group:
        region: "{{ aws_region }}"
        name: "db-sg"
        vpc_id: "{{ vpc_info.vpcs[0].id }}"
        state: absent

    - name: Delete EC2 Security Group
      amazon.aws.ec2_security_group:
        region: "{{ aws_region }}"
        name: "web-sg"
        vpc_id: "{{ vpc_info.vpcs[0].id }}"
        state: absent

    - name: Delete S3 Bucket and all its contents
      amazon.aws.s3_bucket:
        name: chris-app-bucket-12345
        state: absent
        force: true

    - name: Delete Private Subnet (AZ A)
      amazon.aws.ec2_vpc_subnet:
        region: "{{ aws_region }}"
        vpc_id: "{{ vpc_info.vpcs[0].id }}"
        cidr: 10.0.3.0/24
        state: absent

    - name: Delete Private Subnet (AZ B)
      amazon.aws.ec2_vpc_subnet:
        region: "{{ aws_region }}"
        vpc_id: "{{ vpc_info.vpcs[0].id }}"
        cidr: 10.0.4.0/24
        state: absent

    - name: Delete Public Subnet (AZ A)
      amazon.aws.ec2_vpc_subnet:
        region: "{{ aws_region }}"
        vpc_id: "{{ vpc_info.vpcs[0].id }}"
        cidr: 10.0.1.0/24
        state: absent

    - name: Delete Internet Gateway
      amazon.aws.ec2_vpc_igw:
        region: "{{ aws_region }}"
        vpc_id: "{{ vpc_info.vpcs[0].id }}"
        state: absent
   
    - name: Direct CLI Route Table Cleanup & VPC Teardown
      block:
        - name: Find Custom Route Tables via AWS CLI
          ansible.builtin.shell: >
            aws ec2 describe-route-tables 
            --region "{{ aws_region }}" 
            --filters "Name=vpc-id,Values={{ vpc_info.vpcs[0].id }}" 
            --query 'RouteTables[?Associations[0].Main != `true`].RouteTableId' 
            --output text
          register: custom_rtbs
          changed_when: false

        - name: Force Delete Custom Route Tables via AWS CLI
          ansible.builtin.command: >
            aws ec2 delete-route-table 
            --region "{{ aws_region }}" 
            --route-table-id "{{ item }}"
          loop: "{{ custom_rtbs.stdout.split() }}"
          when: custom_rtbs.stdout | length > 0

        - name: Wait for AWS backend to clear dependencies
          ansible.builtin.pause:
            seconds: 5

        - name: Delete Custom VPC
          amazon.aws.ec2_vpc_net:
            region: "{{ aws_region }}"
            name: "app-vpc"
            cidr_block: 10.0.0.0/16
            state: absent
      when: vpc_info.vpcs | length > 0