
---
- name: Require the encrypted database settings
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require the Vault variable before creating resources
      ansible.builtin.assert:
        that:
          - vault_db_master_password is defined
        fail_msg: Run site.yml with -e @group_vars/vault.yml --ask-vault-pass.

- name: Provision AWS Security Groups
  ansible.builtin.import_playbook: playbooks/security_groups.yml

- name: Provision AWS S3 bucket
  ansible.builtin.import_playbook: playbooks/s3.yml

- name: Provision AWS EC2 instance
  ansible.builtin.import_playbook: playbooks/ec2.yml

- name: Provision RDS MySQL database
  ansible.builtin.import_playbook: playbooks/rds.yml
