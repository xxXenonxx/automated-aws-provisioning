---
- name: Read the selected deployment workflow without changing AWS
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Locate the added workflow and clear any previous approval
      ansible.builtin.set_fact:
        deployment_repo_dir: "{{ playbook_dir | regex_replace('/playbooks$', '') }}"
        deployment_creation_approved: false
        deployment_approved_cost_sha256: ''

    - name: Load the user's selected setup
      ansible.builtin.include_vars:
        file: "{{ project_config_file | default(deployment_repo_dir ~ '/config/environment.json') }}"
        name: deployment_settings

    - name: Choose the existing team architecture or existing-network mode
      ansible.builtin.set_fact:
        deployment_workflow: "{{ deployment_settings.profile | default('complete_application') }}"

    - name: Require a supported workflow
      ansible.builtin.assert:
        that:
          - deployment_workflow in ['complete_application', 'resource_provisioning']
        fail_msg: Choose complete_application for the team's full network and application, or resource_provisioning for an existing network.
