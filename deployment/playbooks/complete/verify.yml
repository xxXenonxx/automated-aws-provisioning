---
# Integrates the team's Complete project network and application playbooks.
- name: Verify recorded resources and generate a sanitized deployment report
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Run the read-only AWS and HTTP checks
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../../tools/project_checks.py"
          - verify
          - --manifest
          - "{{ project_manifest_file | default(playbook_dir ~ '/../../state/deployment.json') }}"
          - --output-dir
          - "{{ project_report_dir | default(playbook_dir ~ '/../../reports') }}"
          - --cost-estimate
          - "{{ project_cost_estimate_file | default(playbook_dir ~ '/../../reports/cost-estimate.json') }}"
          - --live
      register: verification_result
      changed_when: true
      failed_when: false

    - name: Show the generated report location
      ansible.builtin.debug:
        msg: "Check report.html and report.json in {{ project_report_dir | default(playbook_dir ~ '/../../reports') }}. Failed or unavailable checks remain visible."
      when: verification_result.rc in [0, 1]

    - name: Explain when verification could not produce a fresh report
      ansible.builtin.debug:
        msg: "Verification could not start or write a fresh report. Check the manifest, Python dependencies and output-directory access. An older report is not evidence for this run."
      when: verification_result.rc not in [0, 1]

    - name: Mark deployment verification unsuccessful when a checked item fails
      ansible.builtin.assert:
        that:
          - verification_result.rc == 0
        fail_msg: "{{ 'Verification found failed or unavailable checks; read the fresh report.' if verification_result.rc == 1 else 'Verification did not complete. A fresh report may not exist.' }}"
