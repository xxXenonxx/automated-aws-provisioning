---
# Integrates the team's Complete project network and application playbooks.
- name: Validate before creating any AWS resources
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Validate JSON settings without calling AWS
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../../tools/project_checks.py"
          - validate
          - --config
          - "{{ project_config_file | default(playbook_dir ~ '/../../config/environment.json') }}"
      changed_when: false

    - name: Load common settings
      ansible.builtin.import_tasks: tasks/load_config.yml

    - name: Reset approval before checking this complete deployment
      ansible.builtin.set_fact:
        deployment_creation_approved: false
        deployment_approved_cost_sha256: ''

    - name: Validate the selected cost assumptions before any resource changes
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ deployment_repo_dir }}/tools/cost_estimate.py"
          - validate
          - --config
          - "{{ project_config_file | default(deployment_repo_dir ~ '/config/environment.json') }}"
          - --assumptions
          - "{{ project_cost_assumptions_file | default(deployment_repo_dir ~ '/config/cost-assumptions.json') }}"
      changed_when: false
      check_mode: false

    - name: Load the exact cost assumptions checked for this deployment
      ansible.builtin.include_vars:
        file: "{{ project_cost_assumptions_file | default(deployment_repo_dir ~ '/config/cost-assumptions.json') }}"
        name: deployment_cost_assumptions

    - name: Build the selected application server names
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ deployment_repo_dir }}/tools/deployment_plan.py"
          - --config
          - "{{ project_config_file | default(deployment_repo_dir ~ '/config/environment.json') }}"
      register: selected_server_plan
      changed_when: false
      check_mode: false

    - name: Keep the same selected server names for pricing and creation
      ansible.builtin.set_fact:
        deployment_instance_names: "{{ (selected_server_plan.stdout | from_json).server_names }}"

    - name: Require a database password supplied through the controller environment
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'RDS_MASTER_PASSWORD') | length >= 8
          - lookup('ansible.builtin.env', 'RDS_MASTER_PASSWORD') | length <= 41
          - "'/' not in lookup('ansible.builtin.env', 'RDS_MASTER_PASSWORD')"
          - "'\"' not in lookup('ansible.builtin.env', 'RDS_MASTER_PASSWORD')"
          - "'@' not in lookup('ansible.builtin.env', 'RDS_MASTER_PASSWORD')"
        fail_msg: Set RDS_MASTER_PASSWORD to 8-41 characters without /, double quote or @.
      no_log: true

    - name: Check the controller has the corresponding SSH private key
      ansible.builtin.stat:
        path: "{{ settings.ssh_private_key_file | expanduser }}"
      register: controller_key

    - name: Stop before creation if the SSH private key is missing
      ansible.builtin.assert:
        that:
          - controller_key.stat.exists
          - controller_key.stat.isreg | default(false)
        fail_msg: The configured SSH private key must exist on the Ansible control node.

    - name: Confirm the AWS identity used by the control node
      amazon.aws.aws_caller_info:
        region: "{{ settings.aws_region }}"
      register: project_identity

    - name: Reuse the same checked account in the shared workflow
      ansible.builtin.set_fact:
        deployment_identity: "{{ project_identity }}"

    - name: Check existing project resource ownership before any creation
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ deployment_repo_dir }}/tools/resource_ownership.py"
          - --config
          - "{{ project_config_file | default(deployment_repo_dir ~ '/config/environment.json') }}"
          - --account
          - "{{ project_identity.account }}"
      changed_when: false
      check_mode: false

    - name: Confirm the key pair exists in the selected region
      amazon.aws.ec2_key_info:
        region: "{{ settings.aws_region }}"
        names:
          - "{{ settings.ec2_key_name }}"
      register: regional_key

    - name: Require the selected AWS key pair
      ansible.builtin.assert:
        that:
          - regional_key.keypairs | length == 1
        fail_msg: The selected EC2 key pair was not found in the configured region.

    - name: Inspect the selected AMI in its actual region
      amazon.aws.ec2_ami_info:
        region: "{{ settings.aws_region }}"
        owners: [amazon]
        image_ids:
          - "{{ settings.ami_id }}"
      register: selected_ami

    - name: Require the operating system supported by the first software template
      ansible.builtin.assert:
        that:
          - selected_ami.images | length == 1
          - selected_ami.images[0].architecture == 'x86_64'
          - selected_ami.images[0].state == 'available'
          - "'al2023' in selected_ami.images[0].name"
        fail_msg: This first software template requires an available official Amazon Linux 2023 x86_64 AMI.

    - name: Keep the application AMI inside the forecast's Linux billing model
      ansible.builtin.assert:
        that:
          - selected_ami.images[0].platform_details | default('') == 'Linux/UNIX'
          - selected_ami.images[0].usage_operation | default('') == 'RunInstances'
          - selected_ami.images[0].product_codes | default([]) | length == 0
          - selected_ami.images[0].root_device_type | default('') == 'ebs'
          - selected_ami.images[0].block_device_mappings | selectattr('ebs', 'defined') | list | length == 1
        fail_msg: Select a standard Linux EBS-backed Amazon Linux image without Marketplace software charges.

    - name: Read the selected server type before provisioning
      amazon.aws.ec2_instance_type_info:
        region: "{{ settings.aws_region }}"
        instance_types:
          - "{{ settings.instance_type }}"
      register: selected_instance_type

    - name: Require image and server compatibility
      ansible.builtin.assert:
        that:
          - selected_instance_type.instance_types | length == 1
          - selected_ami.images[0].architecture in selected_instance_type.instance_types[0].processor_info.supported_architectures
          - "'ebs' in selected_instance_type.instance_types[0].supported_root_device_types"
          - "'on-demand' in selected_instance_type.instance_types[0].supported_usage_classes"
        fail_msg: The selected server type does not support the application image and forecasted On-Demand EBS setup.

    - name: Identify the application's actual AMI root disk
      ansible.builtin.set_fact:
        application_root_mapping: "{{ selected_ami.images[0].block_device_mappings | selectattr('device_name', 'equalto', selected_ami.images[0].root_device_name) | list }}"

    - name: Require the forecasted disk to fit the selected image
      ansible.builtin.assert:
        that:
          - application_root_mapping | length == 1
          - application_root_mapping[0].ebs.volume_size is defined
          - deployment_cost_assumptions.ec2_root_volume_gib | int >= application_root_mapping[0].ebs.volume_size | int
        fail_msg: The selected image needs a larger root disk. Update the usage settings and review the new estimate.

    - name: Bind server creation to the disk included in the forecast
      ansible.builtin.set_fact:
        deployment_root_volume_mapping:
          - device_name: "{{ selected_ami.images[0].root_device_name }}"
            ebs: "{{ {'volume_size': deployment_cost_assumptions.ec2_root_volume_gib | int, 'volume_type': deployment_cost_assumptions.ec2_root_volume_type, 'delete_on_termination': true} | combine({'iops': 3000, 'throughput': 125} if deployment_cost_assumptions.ec2_root_volume_type == 'gp3' else {}) }}"

    - name: Confirm the pre-existing application instance profile
      amazon.aws.iam_instance_profile_info:
        name: "{{ settings.app_instance_profile_name }}"
      register: app_profile

    - name: Require an application profile containing an EC2 role
      ansible.builtin.assert:
        that:
          - app_profile.iam_instance_profiles | length == 1
          - app_profile.iam_instance_profiles[0].roles | length > 0
        fail_msg: Create an EC2 instance profile with a role scoped to the selected S3 bucket first.

    - name: Discover available zones instead of assuming region letters
      amazon.aws.aws_az_info:
        region: "{{ settings.aws_region }}"
        filters:
          state: available
          zone-type: availability-zone
      register: project_azs

    - name: Require two available zones for the database subnet group
      ansible.builtin.assert:
        that:
          - project_azs.availability_zones | length >= 2
        fail_msg: At least two available Availability Zones are required for the DB subnet group.

    - name: Keep the chosen zone order stable between runs
      ansible.builtin.set_fact:
        project_azs: "{{ project_azs | combine({'availability_zones': project_azs.availability_zones | sort(attribute='zone_name')}) }}"

    - name: Require a controller group for the included controller cost
      ansible.builtin.assert:
        that:
          - settings.control_node_security_group_id | default('') is match('^sg-[0-9a-f]+$')
        fail_msg: Supply the dedicated controller security group so its running cost and SSH source can be checked.
      when: deployment_cost_assumptions.include_existing_control_node

    - name: Identify the dedicated controller from its configured security group
      amazon.aws.ec2_instance_info:
        region: "{{ deployment_settings.aws_region }}"
        filters:
          instance.group-id: "{{ deployment_settings.control_node_security_group_id }}"
          instance-state-name: [running, stopped]
      register: cost_controller_instances
      when: deployment_cost_assumptions.include_existing_control_node

    - name: Require one controller whose compute and network match its forecast
      ansible.builtin.assert:
        that:
          - cost_controller_instances.instances | length == 1
          - cost_controller_instances.instances[0].instance_type == deployment_cost_assumptions.control_node.instance_type
          - cost_controller_instances.instances[0].placement.tenancy | default('default') == 'default'
          - cost_controller_instances.instances[0].network_interfaces | length == 1
          - cost_controller_instances.instances[0].network_interfaces[0].private_ip_addresses | length == 1
          - (1 if cost_controller_instances.instances[0].public_ip_address | default('') | length > 0 else 0) == deployment_cost_assumptions.control_node.public_ipv4_count | int
          - cost_controller_instances.instances[0].block_device_mappings | length == 1
        fail_msg: The controller cost assumptions do not match one dedicated instance and its public address. Update the assumptions using your own controller details.
      when: deployment_cost_assumptions.include_existing_control_node

    - name: Inspect the controller AMI billing class without changing it
      amazon.aws.ec2_ami_info:
        region: "{{ deployment_settings.aws_region }}"
        image_ids:
          - "{{ cost_controller_instances.instances[0].image_id }}"
      register: cost_controller_ami
      when: deployment_cost_assumptions.include_existing_control_node

    - name: Require the controller to use the supported standard Linux billing class
      ansible.builtin.assert:
        that:
          - cost_controller_ami.images | length == 1
          - cost_controller_ami.images[0].platform_details | default('') == 'Linux/UNIX'
          - cost_controller_ami.images[0].usage_operation | default('') == 'RunInstances'
          - cost_controller_ami.images[0].product_codes | default([]) | length == 0
        fail_msg: The controller is not a verified standard Linux instance without software product codes. Its operating cost requires another pricing model.
      when: deployment_cost_assumptions.include_existing_control_node

    - name: Identify the actual controller root volume
      ansible.builtin.set_fact:
        cost_controller_root_ids: "{{ cost_controller_instances.instances[0].block_device_mappings | selectattr('device_name', 'equalto', cost_controller_instances.instances[0].root_device_name) | map(attribute='ebs.volume_id') | list }}"
      when: deployment_cost_assumptions.include_existing_control_node

    - name: Require one controller root volume before using its storage forecast
      ansible.builtin.assert:
        that:
          - cost_controller_root_ids | length == 1
        fail_msg: The controller root volume could not be identified. No project resources were created.
      when: deployment_cost_assumptions.include_existing_control_node

    - name: Read the controller root volume details
      amazon.aws.ec2_vol_info:
        region: "{{ deployment_settings.aws_region }}"
        filters:
          volume-id: "{{ cost_controller_root_ids }}"
      register: cost_controller_volume
      when: deployment_cost_assumptions.include_existing_control_node

    - name: Match controller storage to the forecast instead of assuming its disk size
      ansible.builtin.assert:
        that:
          - cost_controller_volume.volumes | length == 1
          - cost_controller_volume.volumes[0].size | int == deployment_cost_assumptions.control_node.root_volume_gib | int
          - cost_controller_volume.volumes[0].type == deployment_cost_assumptions.control_node.root_volume_type
          - cost_controller_volume.volumes[0].type != 'gp3' or (cost_controller_volume.volumes[0].iops | default(0) | int == 3000 and cost_controller_volume.volumes[0].throughput | default(0) | int == 125)
        fail_msg: The controller storage differs from the forecast or includes unmodeled gp3 performance. Correct the declared assumptions before approving deployment.
      when: deployment_cost_assumptions.include_existing_control_node

    - name: Check that the controller's public address is allowed to configure the app
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -c
          - "import ipaddress,sys; sys.exit(0 if ipaddress.ip_address(sys.argv[1]) in ipaddress.ip_network(sys.argv[2], strict=True) else 1)"
          - "{{ cost_controller_instances.instances[0].public_ip_address | default('') }}"
          - "{{ settings.ssh_source_cidr }}"
      changed_when: false
      when: deployment_cost_assumptions.include_existing_control_node

    - name: Inspect application servers already owned by this environment
      amazon.aws.ec2_instance_info:
        region: "{{ settings.aws_region }}"
        filters:
          "tag:Project": "{{ settings.project_name }}"
          "tag:Environment": "{{ settings.environment_name }}"
          "tag:Role": application
          instance-state-name: [pending, running, stopping, stopped]
      register: existing_complete_servers

    - name: Do not hide retained or duplicate servers from the forecast
      ansible.builtin.assert:
        that:
          - existing_complete_servers.instances | map(attribute='tags.Name') | difference(deployment_instance_names) | length == 0
          - existing_complete_servers.instances | map(attribute='tags.Name') | unique | list | length == existing_complete_servers.instances | length
        fail_msg: Existing application servers differ from the selected names. Review retained or duplicate servers separately before deployment.

    - name: Resolve the existing project network by its scoped name
      amazon.aws.ec2_vpc_net_info:
        region: "{{ settings.aws_region }}"
        filters:
          "tag:Name": "{{ project_resource_prefix }}-vpc"
      register: previous_complete_vpc

    - name: Require a single project network for any retained application server
      ansible.builtin.assert:
        that:
          - previous_complete_vpc.vpcs | length <= 1
          - existing_complete_servers.instances | length == 0 or previous_complete_vpc.vpcs | length == 1
        fail_msg: Retained application servers cannot be matched to a unique project VPC.

    - name: Resolve the existing public application subnet
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ settings.aws_region }}"
        filters:
          vpc-id: "{{ previous_complete_vpc.vpcs[0].vpc_id }}"
          "tag:Name": "{{ project_resource_prefix }}-public-a"
      register: previous_complete_public_subnet
      when: existing_complete_servers.instances | length > 0

    - name: Require a single public subnet for retained application servers
      ansible.builtin.assert:
        that:
          - previous_complete_public_subnet.subnets | length == 1
        fail_msg: Retained application servers cannot be matched to the selected public subnet.
      when: existing_complete_servers.instances | length > 0

    - name: Keep each retained server inside the selected compute and disk model
      ansible.builtin.assert:
        that:
          - item.image_id == settings.ami_id
          - item.instance_type == settings.instance_type
          - item.vpc_id == previous_complete_vpc.vpcs[0].vpc_id
          - item.subnet_id == previous_complete_public_subnet.subnets[0].subnet_id
          - item.iam_instance_profile.arn | default('') | regex_replace('^.*/', '') == settings.app_instance_profile_name
          - item.placement.tenancy | default('default') == 'default'
          - item.block_device_mappings | length == 1
          - item.network_interfaces | length == 1
          - item.network_interfaces[0].private_ip_addresses | length == 1
          - item.state.name != 'running' or item.public_ip_address | default('') | length > 0
          - settings.control_node_security_group_id | default('') not in (item.security_groups | map(attribute='group_id') | list)
          - item.tags.ManagedBy | default('') == 'Ansible'
        fail_msg: A retained application server differs from the selected setup or appears to be the controller. No resources have been created.
      loop: "{{ existing_complete_servers.instances }}"
      loop_control:
        label: "{{ item.instance_id }}"

    - name: Identify each retained application's root volume
      ansible.builtin.set_fact:
        complete_root_volume_ids: "{{ existing_complete_servers.instances | map(attribute='block_device_mappings') | flatten | map(attribute='ebs.volume_id') | list }}"

    - name: Read retained application root disks
      amazon.aws.ec2_vol_info:
        region: "{{ settings.aws_region }}"
        filters:
          volume-id: "{{ complete_root_volume_ids }}"
      register: complete_root_volumes
      when: complete_root_volume_ids | length > 0

    - name: Require the forecasted size and performance on retained disks
      ansible.builtin.assert:
        that:
          - complete_root_volumes.volumes | length == complete_root_volume_ids | length
          - item.size | int == deployment_cost_assumptions.ec2_root_volume_gib | int
          - item.type == deployment_cost_assumptions.ec2_root_volume_type
          - item.type != 'gp3' or (item.iops | default(0) | int == 3000 and item.throughput | default(0) | int == 125)
        fail_msg: A retained application disk differs from the forecast. Review the setup instead of silently resizing it.
      loop: "{{ complete_root_volumes.volumes | default([]) }}"
      loop_control:
        label: "{{ item.id }}"
      when: complete_root_volume_ids | length > 0

    - name: Resolve a MySQL version in standard support for the forecast
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ deployment_repo_dir }}/tools/rds_preflight.py"
          - --region
          - "{{ settings.aws_region }}"
          - --db-identifier
          - "{{ settings.rds_identifier }}"
          - --forecast-days
          - '31'
          - --instance-class
          - "{{ settings.db_instance_class }}"
          - --allocated-storage
          - "{{ settings.db_allocated_storage | string }}"
          - --multi-az
          - "{{ settings.db_multi_az | string | lower }}"
      register: complete_rds_support_check
      changed_when: false
      check_mode: false

    - name: Keep the checked MySQL engine version for creation and reporting
      ansible.builtin.set_fact:
        deployment_rds_support: "{{ complete_rds_support_check.stdout | from_json }}"
        deployment_rds_engine_version: "{{ (complete_rds_support_check.stdout | from_json).engine_version }}"

    - name: Show a concise preflight result without secret values
      ansible.builtin.debug:
        msg: "Preflight passed for {{ settings.project_name }}/{{ settings.environment_name }} in {{ settings.aws_region }}. No resources were created by this play."
