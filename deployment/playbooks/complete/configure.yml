---
# Integrates the team's Complete project network and application playbooks.
- name: Resolve only this deployment application target
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Load and validate the application target from the manifest
      ansible.builtin.import_tasks: tasks/load_targets.yml

- name: Install the team's Apache and PHP example on the selected application servers
  hosts: project_application_servers
  become: true
  gather_facts: false
  tasks:
    - name: Start this server's setup with an incomplete status
      ansible.builtin.set_fact:
        project_application_setup_complete: false

    - name: Wait for the application server SSH connection
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather operating system facts
      ansible.builtin.setup:
        gather_subset: [min]

    - name: Stop before package changes on unsupported operating systems
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Amazon'
          - ansible_facts.distribution_major_version == '2023'
        fail_msg: This first software template supports Amazon Linux 2023 only.

    - name: Install Apache, PHP and required extensions
      ansible.builtin.dnf:
        name:
          - httpd
          - php
          - php-mysqlnd
          - php-xml
          - php-mbstring
          - unzip
          - acl
        state: present

    - name: Create the application directory
      ansible.builtin.file:
        path: /var/www/html
        owner: apache
        group: apache
        mode: '0755'
        state: directory

    - name: Create a nonpublic configuration directory
      ansible.builtin.file:
        path: /etc/aws-project
        owner: root
        group: apache
        mode: '0750'
        state: directory

    - name: Write the actual application connections outside the public web directory
      ansible.builtin.copy:
        dest: /etc/aws-project/app-config.json
        owner: root
        group: apache
        mode: '0640'
        content: >-
          {{ {
            's3_bucket_name': deployment_outputs.resources.s3_bucket_name,
            'db_endpoint': deployment_outputs.resources.rds_endpoint,
            'db_port': deployment_outputs.resources.rds_port,
            'db_name': deployment_settings.db_name,
            'db_user': deployment_settings.db_username,
            'db_password': lookup('ansible.builtin.env', 'RDS_MASTER_PASSWORD'),
            'region': deployment_outputs.aws_region
          } | to_nice_json }}
      no_log: true

    - name: Fetch the Composer installer signature using TLS
      ansible.builtin.uri:
        url: https://composer.github.io/installer.sig
        return_content: true
      register: composer_signature

    - name: Download the Composer installer and verify its published checksum
      ansible.builtin.get_url:
        url: https://getcomposer.org/installer
        dest: /usr/local/src/composer-setup.php
        mode: '0644'
        checksum: "sha384:{{ composer_signature.content | trim }}"

    - name: Install Composer
      ansible.builtin.command:
        argv:
          - php
          - /usr/local/src/composer-setup.php
          - --install-dir=/usr/local/bin
          - --filename=composer
        creates: /usr/local/bin/composer

    - name: Prepare the application Composer cache
      ansible.builtin.file:
        path: /var/cache/aws-project-composer
        owner: apache
        group: apache
        mode: '0750'
        state: directory

    - name: Declare this template AWS SDK dependency
      ansible.builtin.copy:
        dest: /var/www/html/composer.json
        owner: apache
        group: apache
        mode: '0644'
        content: |
          {"require":{"aws/aws-sdk-php":"^3.0"}}

    - name: Install the application PHP dependency
      become_user: apache
      ansible.builtin.command:
        argv:
          - /usr/local/bin/composer
          - install
          - --no-dev
          - --prefer-dist
          - --no-interaction
          - --no-progress
        chdir: /var/www/html
        creates: /var/www/html/vendor/autoload.php
      environment:
        COMPOSER_HOME: /var/cache/aws-project-composer

    - name: Deploy the existing gallery demonstration using actual connection settings
      ansible.builtin.template:
        src: index.php.j2
        dest: /var/www/html/index.php
        owner: root
        group: apache
        mode: '0644'

    - name: Enable PHP and the Apache web service
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: [php-fpm, httpd]

    - name: Record successful software installation
      ansible.builtin.set_fact:
        project_application_setup_complete: true

- name: Record application setup only after every selected server succeeds
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require successful setup on every selected application server
      ansible.builtin.assert:
        that:
          - groups.project_application_servers | default([]) | length == hostvars.localhost.deployment.resources.ec2_instance_ids | length
          - groups.project_application_servers | map('extract', hostvars, 'project_application_setup_complete') | select('equalto', true) | list | length == groups.project_application_servers | length
        fail_msg: Application setup did not finish on every selected server. The manifest remains marked incomplete.

    - name: Mark the saved application setup complete without storing secrets
      ansible.builtin.copy:
        dest: "{{ project_state_dir }}/deployment.json"
        mode: '0600'
        content: >-
          {{ deployment | combine({
            'expected': deployment.expected | combine({'application_configured': true})
          }) | to_nice_json }}
